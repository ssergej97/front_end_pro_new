<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Edit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
<main>
    <h1 class="text-center pt-4 pb-3">Product Book</h1>
    <hr>
    <div class="container">
        <div class="row">
            <!-- Form -->
            <div class="col-4">
                <h2>Edit product</h2>
                <hr>
                <form data-form>
                    <div class="mb-3">
                        <label for="itemName" class="form-label">Name</label>
                        <input required name="itemName" type="text" class="form-control" id="itemName" placeholder="Name">
                    </div>
                    <div class="mb-3">
                        <label for="itemPrice" class="form-label">Price</label>
                        <input required min="0.1" step="any" name="itemPrice" type="number" class="form-control" id="itemPrice" placeholder="Price">
                    </div>
                    <div class="mb-4">
                        <label for="floatingTextarea">Description</label>
                        <textarea required name="itemDescription" class="form-control" placeholder="Description.." id="floatingTextarea"></textarea>
                    </div>
                    <button  type="submit" class="btn btn-success" data-btn>Save</button>
                </form>
            </div>
        </div>
    </div>
</main>
<script src="model.js"></script>
<script src="edit.js"></script>
<!--<script src="controller.js"></script>-->
</body>
</html>
