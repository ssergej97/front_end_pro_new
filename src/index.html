<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <title>To Do List</title>
  <link rel="stylesheet" href="./styles/index.css">
  <script src="script.js" type="module"></script>
</head>
<body>
  <div class="todo" data-js-todo>
    <div class="todo__title">To Do List</div>
    <form class="todo__form" data-js-todo-new-task-form>
      <div class="todo__field field">
        <label for="new-task" class="field__label">Enter a task title</label>
        <input class="field__input" id="new-task" placeholder=" " autocomplete="off" data-js-todo-new-task-input>
      </div>
      <button class="button" type="submit">
        Add
      </button>
    </form>
    <form class="todo__form" data-js-filter-task-form>
      <div class="todo__field field">
        <label for="filter-task" class="field__label">Filter</label>
        <select name="filter" id="filter-task" data-js-filter-task-input>
          <option value="all" selected>All</option>
          <option value="active">Active</option>
          <option value="completed">Completed</option>
        </select>
      </div>
    </form>
    <div class="todo__info">
      <div class="todo__done">
        Done: <span data-js-done-tasks>0</span>
      </div>
      <div class="todo__in-progress">
        In progress: <span data-js-inprogress-tasks>0</span>
      </div>
    </div>
    <ul class="todo__list" data-js-todo-list>
      <li class="todo__item todo-item" data-js-todo-item>
        <input type="checkbox" id="todo-1" class="todo-item__checkbox" data-js-todo-item-checkbox>
        <label for="todo-1" class="todo-item__label" data-js-todo-item-label>
          Todo 1
        </label>
        <button class="todo-item__delete-button" type="button" title="Delete" aria-label="delete" data-js-todo-item-delete-button>
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 5L5 15M5 5L15 15" stroke="#757575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </li>
      <li class="todo__item todo-item" data-js-todo-item>
        <input type="checkbox" id="todo-1" class="todo-item__checkbox" data-js-todo-item-checkbox>
        <label for="todo-1" class="todo-item__label" data-js-todo-item-label>
          Todo 1
        </label>
        <button class="todo-item__delete-button" type="button" title="Delete" aria-label="delete" data-js-todo-item-delete-button>
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 5L5 15M5 5L15 15" stroke="#757575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </li>
    </ul>
    <div class="todo__empty-message" data-js-todo-empty-message></div>
  </div>
</body>
</html>
