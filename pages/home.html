<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    >
    <meta
            http-equiv="X-UA-Compatible"
            content="ie=edge"
    >
    <title>To do list</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
            crossorigin="anonymous"
    >
    <link
            rel="stylesheet"
            href="../styles/style.css"
    >
</head>
<body>
<main>
    <h1 class="text-center mt-5 mb-5">TODO LIST</h1>
    <div class="container">
        <div class="row">
            <div class="col-4">
                <!--          Form-->
                <form id="todoForm">
                    <div class="mb-3">
                        <label class="form-label" for="text-title">Task title</label>
                        <input
                                type="text"
                                name="title"
                                class="form-control"
                                placeholder="Title"
                                id="text-title"
                                required
                        >
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="text-description">Task body</label>
                        <textarea
                                name="description"
                                class="form-control"
                                placeholder="Task body"
                                cols="30"
                                rows="10"
                                id="text-description"
                                required
                        ></textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                        <div>
                            <button
                                    type="submit"
                                    class="btn btn-primary"
                            >Create Task
                            </button>
                            <button
                                    type="reset"
                                    class="btn btn-warning"
                            >Clear
                            </button>
                        </div>
                        <button
                                type="button"
                                class="btn btn-danger remove-all"
                        >Delete all
                        </button>
                    </div>
                </form>
            </div>


            <div class="col-8">
                <div
                        class="row"
                        id="todoItems"
                ></div>
            </div>
        </div>
    </div>
</main>
<script src="../scripts/Model.js"></script>
<script src="../scripts/Controller.js"></script>
<script src="../scripts/View.js"></script>
</body>
</html>
